name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Check pipeline imports cleanly
        run: python -c "import run, pipeline.enrich, pipeline.score, pipeline.publish, pipeline.digest, pipeline.masks"
