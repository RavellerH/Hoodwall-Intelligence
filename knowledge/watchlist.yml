# Flow-trace seeds: addresses submitted for money-flow tracing, before they
# are known well enough to be wallet records.
#
# A wallet record in knowledge/wallets/ must name a chain, and a bare 0x
# address carries none - the same 40 hex characters exist on every EVM
# chain. So a submitted address is recorded here first, and
# scripts/trace_flow.py probes every readable EVM chain to find where it is
# actually active before promoting it to knowledge/wallets/<chain>.yml.
#
# Fields: address (required), handle, entity, source_url, labels,
# confidence, added, note.
#
#     python scripts/trace_flow.py            # trace every seed below
#     python scripts/trace_flow.py --write-kb # promote what it finds

