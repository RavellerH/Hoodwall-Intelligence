<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOODWALL TERMINAL</title>
<meta name="description" content="Multi-chain wallet and narrative intelligence terminal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text y='.92em' x='8' font-size='78' fill='%23ffa028' font-family='monospace'>H</text></svg>">
<link rel="stylesheet" href="terminal.css">
</head>
<body>

<header class="topbar">
  <span class="brand">HOODWALL<span class="dim">·</span>INTELLIGENCE</span>
  <span class="sep">│</span>
  <span id="ticker" class="ticker">LOADING…</span>
  <span class="spacer"></span>
  <span id="kb-health" class="health"></span>
  <span class="sep">│</span>
  <span id="clock" class="clock">--:--:-- UTC</span>
</header>

<div class="cmdbar">
  <label for="cmd" class="prompt">CMD</label>
  <input id="cmd" type="text" autocomplete="off" spellcheck="false"
         placeholder="type a command or filter — HELP for commands, / to focus">
  <span id="cmdhint" class="cmdhint"></span>
</div>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Views">
    <div class="nav-title">FUNCTIONS</div>
    <button class="navitem" data-view="DASH"><b>1</b> DASH<span>overview</span></button>
    <button class="navitem" data-view="WAL"><b>2</b> WAL<span>wallets</span></button>
    <button class="navitem" data-view="ENT"><b>3</b> ENT<span>entities</span></button>
    <button class="navitem" data-view="NAR"><b>4</b> NAR<span>narratives</span></button>
    <button class="navitem" data-view="MAP"><b>5</b> MAP<span>graph</span></button>
    <button class="navitem" data-view="PNL"><b>6</b> PNL<span>p&amp;l</span></button>
    <button class="navitem" data-view="SENT"><b>7</b> SENT<span>sentiment</span></button>
    <button class="navitem" data-view="CHN"><b>8</b> CHN<span>chains</span></button>
    <button class="navitem" data-view="SRC"><b>9</b> SRC<span>sources</span></button>
    <div class="nav-title">FILTER</div>
    <div id="chainfilter" class="navfilter"></div>
  </nav>

  <main class="main">
    <div class="panel-head">
      <span id="panel-title">DASH</span>
      <span class="spacer"></span>
      <span id="panel-count" class="dim"></span>
    </div>
    <div id="panel" class="panel" tabindex="0"></div>
  </main>

  <aside class="detail" id="detail">
    <div class="panel-head"><span id="detail-title">DETAIL</span></div>
    <div id="detail-body" class="detail-body">
      <p class="dim">Select a row — <b>↑↓</b> to move, <b>ENTER</b> to open.</p>
    </div>
  </aside>
</div>

<footer class="fkeys" id="fkeys"></footer>

<script src="graph.js"></script>
<script src="terminal.js"></script>
</body>
</html>
