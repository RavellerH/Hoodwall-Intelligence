<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoodwall Intelligence</title>
<meta name="description" content="Multi-chain wallet, narrative and sentiment monitoring.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234c5fea'/><path d='M9 20 L14 13 L18 17 L23 9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">HW</span>
      <span class="brand-name">Hoodwall</span>
    </div>

    <nav class="nav" id="nav" aria-label="Sections">
      <button class="navitem" data-view="DASH" data-icon="grid">Overview</button>
      <button class="navitem" data-view="WAL" data-icon="wallet">Wallets</button>
      <button class="navitem" data-view="ENT" data-icon="users">Entities</button>
      <button class="navitem" data-view="NAR" data-icon="doc">Narratives</button>
      <button class="navitem" data-view="MAP" data-icon="share">Relationship Map</button>
      <button class="navitem" data-view="PNL" data-icon="dollar">Positions &amp; P&amp;L</button>
      <button class="navitem" data-view="SENT" data-icon="pulse">Sentiment</button>
      <div class="nav-sep"></div>
      <button class="navitem" data-view="CHN" data-icon="link">Chains</button>
      <button class="navitem" data-view="SRC" data-icon="stack">Sources</button>
    </nav>

    <div class="sidebar-foot">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
        <span class="ti-light" data-icon="sun"></span>
        <span class="ti-dark" data-icon="moon"></span>
      </button>
      <div class="updated" id="updated">—</div>
    </div>
  </aside>

  <div class="mainwrap">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" data-icon="menu"></button>

      <div class="searchwrap">
        <span class="search-icon" data-icon="search"></span>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search wallet, entity, token, narrative…">
        <kbd class="search-kbd">/</kbd>
      </div>

      <div class="ticker" id="ticker" aria-label="Market prices"></div>

      <div class="health" id="kb-health"></div>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <div class="page-actions" id="page-actions"></div>
      </div>
      <div id="panel" class="panel" tabindex="0"></div>
    </main>
  </div>

  <aside class="detail" id="detail">
    <div class="detail-head">
      <span id="detail-title">Details</span>
      <button id="detail-close" class="icon-btn" type="button" aria-label="Close" data-icon="x"></button>
    </div>
    <div id="detail-body" class="detail-body">
      <div class="empty-hint">
        <span data-icon="cursor" class="empty-hint-icon"></span>
        <p>Select a row to see details.</p>
      </div>
    </div>
  </aside>
</div>
<div class="scrim" id="scrim" hidden></div>

<script src="graph.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
